name: Deploy to AWS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      # Allowlist: only these paths ever land in dist/, so only these are ever public.
      - name: Copy to dist
        run: |
          rm -rf dist
          mkdir -p dist
          cp -R index.html robots.txt sitemap.xml site.webmanifest llms.txt assets dist/
          rm -f dist/assets/css/*.map

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to S3
        run: aws s3 sync ./dist "s3://${{ vars.S3_BUCKET }}" --delete

      # Commented out to reduce cost — invalidate manually for now
